<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#111318">
  <title>Manga-scan</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="logo">Manga<span>scan</span></a>
    <form id="search" class="search" role="search">
      <input id="q" type="search" placeholder="Rechercher un manga…" autocomplete="off">
    </form>
    <a href="#/web" class="iconbtn" id="webbtn" title="Web" aria-label="Navigateur web">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
    </a>
    <select id="lang" title="Langue des chapitres">
      <option value="fr">FR</option>
      <option value="en">EN</option>
      <option value="es-la">ES</option>
      <option value="pt-br">PT</option>
      <option value="it">IT</option>
      <option value="de">DE</option>
    </select>
  </header>
  <main id="app"></main>
  <script src="mangadex.js"></script>
  <script src="app.js"></script>
</body>
</html>
