name: APK Android

on:
  push:
    branches: ['**']
    paths: ['public/**', 'android/**', 'capacitor.config.json', 'package*.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: npm ci

      - name: Copie de l'interface dans le projet Android
        run: npx cap sync android

      - name: Compilation de l'APK
        working-directory: android
        run: |
          echo "SDK Android : $ANDROID_HOME"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Manga-scan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Manga-scan-apk
          path: Manga-scan.apk

      - name: Publication (Release GitHub)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Manga-scan APK n°${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            APK Android de Manga-scan (branche ${{ github.ref_name }}, commit ${{ github.sha }}).
            Téléchargez Manga-scan.apk sur votre téléphone, puis autorisez l'installation depuis des sources inconnues.
          files: Manga-scan.apk
